# Takip edilecek şirketler.
#
# Zorunlu alanlar sadece `name` ve `domain`. Hangi ATS'i kullandıklarını
# bilmene gerek yok — `jobradar probe` komutu ağ üzerinden deneyerek bulur
# ve kaydeder (LLM kullanmadan).
#
# Biliyorsan doğrudan yazabilirsin, o zaman probe atlanır:
#   - name: Örnek A.Ş.
#     domain: ornek.com
#     adapter_type: greenhouse        # greenhouse|lever|ashby|workable|recruitee|personio|smartrecruiters
#     adapter_config: { token: ornek }
#
# Kariyer sayfası URL'sini biliyorsan onu yazmak da yeterli — URL deseninden
# ATS tanınabiliyorsa hiç ağ isteği yapılmaz:
#   - name: Örnek A.Ş.
#     domain: ornek.com
#     careers_url: https://jobs.lever.co/ornek

companies:
  # --- Buraya kendi hedef şirketlerini ekle (30-50 tane hedefliyoruz) ---
  # Aşağıdakiler yalnızca biçim örneğidir; `probe` çalıştırıldığında
  # hangilerinin desteklenen bir ATS kullandığı ampirik olarak belirlenir.
  # Desteklenen ATS bulunmayanlar Faz 2/3'te JSON-LD veya LLM katmanına düşer.

  - name: Trendyol
    domain: trendyol.com

  - name: Getir
    domain: getir.com

  - name: Insider
    domain: useinsider.com

  - name: Hepsiburada
    domain: hepsiburada.com

  - name: Peak
    domain: peak.com

  - name: Dream Games
    domain: dreamgames.com

  - name: Papara
    domain: papara.com

  - name: iyzico
    domain: iyzico.com

  - name: Param
    domain: param.com.tr

  - name: Logo Yazılım
    domain: logo.com.tr

